# Plain environment for the staging worker job (splitsmith worker --one-shot).
SPLITSMITH_MODE: hosted
SPLITSMITH_PUBLIC_URL: https://my.staging.splitsmith.app
SPLITSMITH_EMAIL_BACKEND: console
SPLITSMITH_S3_BUCKET: splitsmith-uploads-staging
SPLITSMITH_S3_REGION: auto
SPLITSMITH_YOUTUBE_CLIENT_ID: 285062947261-0ueh6s2lovpg3nfe8nv3ita4n6un1bit.apps.googleusercontent.com
# The job's size as deploy-app.yml sets it (--cpu 4 --memory 8Gi); keep in
# step. Read into each job's timings (observability.container_limits),
# since Cloud Run exposes the limits nowhere a process can read them.
SPLITSMITH_WORKER_VCPU: "4"
SPLITSMITH_WORKER_MEMORY_MB: "8192"
# The job's --task-timeout as deploy-app.yml sets it; keep in step. The
# one-shot drain stops claiming jobs this many seconds after its start less
# SPLITSMITH_WORKER_DRAIN_MARGIN_S (default 900), so the timeout never
# kills a job part-way (queue.drain_budget_seconds).
SPLITSMITH_WORKER_TASK_TIMEOUT_S: "3600"
