# Plain (non-secret) environment for the production serve service. Secrets are
# mounted from Secret Manager by production-serve.secrets.
SPLITSMITH_MODE: hosted
SPLITSMITH_PUBLIC_URL: https://my.splitsmith.app
FORWARDED_ALLOW_IPS: "*"
SPLITSMITH_ACCESS_DEFAULT_TIER: sharing
SPLITSMITH_SIGNUPS_OPEN: "false"
SPLITSMITH_EMAIL_BACKEND: lettermint
SPLITSMITH_EMAIL_FROM: Splitsmith <login@splitsmith.app>
SPLITSMITH_S3_BUCKET: splitsmith-uploads-prod
SPLITSMITH_S3_REGION: auto
SPLITSMITH_YOUTUBE_CLIENT_ID: 285062947261-0ueh6s2lovpg3nfe8nv3ita4n6un1bit.apps.googleusercontent.com
# The scale-to-zero worker is a Cloud Run Job; self-hosted boxes poll a
# marker in the bucket instead of holding a connection to serve.
SPLITSMITH_WORKER_LAUNCHER: cloud_run
SPLITSMITH_WORKER_JOB: projects/splitsmith-hosting/locations/europe-west1/jobs/splitsmith-worker-production
# Fan-out cap: executions serve runs at once for one backlog. Serve starts
# one execution per SPLITSMITH_WORKER_JOBS_PER_EXECUTION (2) queued jobs, so a
# 12-stage compare grid (12 stage jobs plus the grid job) gets 7; the cap
# leaves room above that. 13 x 4 vCPU is 52 of the region's 200 vCPU quota,
# which staging and production share.
SPLITSMITH_WORKER_MAX_EXECUTIONS: "13"
SPLITSMITH_WAKE_CHANNEL: r2
