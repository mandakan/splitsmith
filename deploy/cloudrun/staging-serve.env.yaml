# Plain (non-secret) environment for the staging serve service. Secrets are
# mounted from Secret Manager by staging-serve.secrets.
SPLITSMITH_MODE: hosted
SPLITSMITH_PUBLIC_URL: https://my.staging.splitsmith.app
FORWARDED_ALLOW_IPS: "*"
SPLITSMITH_SIGNUPS_OPEN: "false"
SPLITSMITH_EMAIL_BACKEND: console
SPLITSMITH_S3_BUCKET: splitsmith-uploads-staging
SPLITSMITH_S3_REGION: auto
SPLITSMITH_YOUTUBE_CLIENT_ID: 285062947261-0ueh6s2lovpg3nfe8nv3ita4n6un1bit.apps.googleusercontent.com
# The scale-to-zero worker is a Cloud Run Job; self-hosted boxes poll a
# marker in the bucket instead of holding a connection to serve.
SPLITSMITH_WORKER_LAUNCHER: cloud_run
SPLITSMITH_WORKER_JOB: projects/splitsmith-hosting/locations/europe-west1/jobs/splitsmith-worker-staging
# Fan-out cap: executions serve runs at once for one backlog. 8 x 4 vCPU is
# 32 of the region's 200 vCPU quota, which staging and production share.
SPLITSMITH_WORKER_MAX_EXECUTIONS: "8"
SPLITSMITH_WAKE_CHANNEL: r2
