appId: app.splitsmith.desktop
productName: Splitsmith
copyright: Copyright (c) Mathias Axell
directories:
  output: dist
  buildResources: build-resources
files:
  - out/**
  - src/loading.html
  - package.json
extraResources:
  - from: build/runtime/python
    to: python
  - from: build/bin
    to: bin
  - from: build/NOTICES.md
    to: NOTICES.md
asar: true
mac:
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.video
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: entitlements.plist
  entitlementsInherit: entitlements.plist
  # Reads APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER; skipped with
  # CSC_IDENTITY_AUTO_DISCOVERY=false.
  notarize: true
  darkModeSupport: true
  extendInfo:
    # readlink -f in the CLI shim needs 12.3; round up to a supported major.
    LSMinimumSystemVersion: "13.0"
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: AudioVideo
  executableName: splitsmith-desktop
  icon: build-resources/linux-icons
  synopsis: Shot splits from head-cam footage
  description: Splitsmith finds the beep and every shot in IPSC head-cam footage and turns them into splits, an audit trail and rendered videos.
  maintainer: Mathias Axell <m@thias.se>
  extraResources:
    - from: build-resources/linux-icons/512x512.png
      to: icon.png
appImage:
  artifactName: ${productName}-${version}-x86_64.${ext}
  # The legacy toolset's desktop entry passes --no-sandbox unconditionally.
  executableArgs: []
deb:
  artifactName: splitsmith-desktop_${version}_amd64.${ext}
  depends: [libnss3, libgbm1, libasound2, libgtk-3-0, libxss1, libnotify4, xdg-utils, libatspi2.0-0, libdrm2, libxkbcommon0]
  afterInstall: build/linux/postinst.sh
  afterRemove: build/linux/postrm.sh
