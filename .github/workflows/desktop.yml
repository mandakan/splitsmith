name: desktop

# The desktop bundles on PRs: the unsigned macOS DMG, opened, installed and
# launched (desktop-macos.yml), and the Linux AppImage + deb
# (desktop-linux.yml), and the Windows installer and zip, smoked unpacked and
# installed (desktop-windows.yml). None uploads to a release; signing and
# notarization stay local (spec 2026-09-20).
on:
  pull_request:
    paths:
      - "desktop/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/desktop.yml"
      - ".github/workflows/desktop-macos.yml"
      - ".github/workflows/desktop-linux.yml"
      - ".github/workflows/desktop-windows.yml"
      - "scripts/ci/fetch_pypi_wheel.py"
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    uses: ./.github/workflows/desktop-macos.yml

  linux:
    # Build, smoke, launch, artifact; no release_tag, so no upload. The
    # called job declares contents: write, which a caller must grant.
    uses: ./.github/workflows/desktop-linux.yml
    permissions:
      contents: write

  windows:
    uses: ./.github/workflows/desktop-windows.yml
