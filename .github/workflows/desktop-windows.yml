name: desktop-windows

# The Windows NSIS installer and zip (#1765), built under Git Bash by the same
# build.sh as macOS and Linux, with our pinned ffmpeg (fetch-ffmpeg.sh). Then
# the slim import check and smoke.sh against the unpacked app, and a silent
# per-user install, smoke.sh and launch-check.sh against the installed copy,
# and an uninstall. Called by desktop.yml on PRs (checkout-built wheel,
# artifacts only) and by release-please.yml after PyPI has the version (the
# PyPI wheel). Unsigned until code signing lands, so a release only gets the
# installer and zip attached when the repo variable WINDOWS_RELEASE_ATTACH is
# "true": an attached .exe is what makes the update feed offer Windows.
on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      release_tag:
        description: "vX.Y.Z to build (and attach, if WINDOWS_RELEASE_ATTACH is true); empty for a checkout build"
        required: false
        default: ""

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: windows x64 installer + zip + smoke
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      UV_PYTHON: "3.12"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
      - uses: actions/cache@v4
        with:
          path: ~/.splitsmith/models
          key: models-${{ hashFiles('src/splitsmith/data/ensemble_calibration.json') }}

      - name: Published wheel
        if: inputs.release_tag != ''
        run: |
          wheel="$(uv run --no-project python scripts/ci/fetch_pypi_wheel.py "${{ inputs.release_tag }}" build/wheel)"
          echo "WHEEL=$PWD/$wheel" >> "$GITHUB_ENV"

      - name: Build
        env:
          # A tagged build must carry the baked YouTube OAuth client (the PyPI wheel has it).
          SPLITSMITH_REQUIRE_YOUTUBE_CLIENT: ${{ inputs.release_tag != '' && '1' || '0' }}
        run: desktop/build.sh --windows ${WHEEL:+--wheel "$WHEEL"}

      - name: Slim import surface
        run: desktop/dist/win-unpacked/resources/python/python.exe scripts/ci/assert_slim_import_surface.py

      - name: ffmpeg
        # build-ffmpeg.sh cross-compiles and cannot run the .exe, so this is
        # where the build's encoder and filter checks really run.
        run: |
          ff=desktop/dist/win-unpacked/resources/bin/ffmpeg.exe
          encoders="$("$ff" -hide_banner -encoders)"; filters="$("$ff" -hide_banner -filters)"
          grep -q libx264 <<<"$encoders" || { echo "no libx264 encoder" >&2; exit 1; }
          grep -q drawtext <<<"$filters" || { echo "no drawtext filter" >&2; exit 1; }
          "$ff" -version | head -1

      - name: Smoke (unpacked)
        run: desktop/smoke.sh desktop/dist/win-unpacked

      - name: Install, smoke, launch, uninstall
        # Start-Process -Wait: the NSIS installer returns before it is done
        # when started from bash. Git Bash would turn a bare /S into a path.
        run: |
          setup="$(cygpath -w "$(ls desktop/dist/*-Setup-*.exe)")"
          powershell -NoProfile -Command "Start-Process -FilePath '$setup' -ArgumentList '/S' -Wait"
          programs="$(cygpath -u "$LOCALAPPDATA")/Programs"
          app="$(dirname "$(dirname "$(ls -d "$programs"/*/resources/python | head -1)")")"
          [ -d "$app/resources" ] || { echo "nothing installed under $programs" >&2; ls "$programs" >&2; exit 1; }
          echo "installed at $app"
          ls "$app"/*.exe
          desktop/smoke.sh "$app"
          desktop/launch-check.sh "$app"
          uninst="$(cygpath -w "$(ls "$app"/Uninstall*.exe)")"
          powershell -NoProfile -Command "Start-Process -FilePath '$uninst' -ArgumentList '/S' -Wait"
          # The uninstaller copies itself to %TEMP% and finishes from there.
          for _ in $(seq 1 60); do [ -e "$app/resources" ] || break; sleep 2; done
          [ ! -e "$app/resources" ] || { echo "uninstall left $app/resources" >&2; exit 1; }

      - name: Checksums
        run: cd desktop/dist && sha256sum *.exe *.zip > SHA256SUMS && cat SHA256SUMS && ls -la *.exe *.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Splitsmith-windows-x64
          path: |
            desktop/dist/*.exe
            desktop/dist/*.zip
            desktop/dist/SHA256SUMS
          retention-days: 14

      - name: Attach to the release
        if: inputs.release_tag != '' && vars.WINDOWS_RELEASE_ATTACH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd desktop/dist && mv SHA256SUMS SHA256SUMS-windows
          gh release upload "${{ inputs.release_tag }}" *.exe *.zip SHA256SUMS-windows --clobber
