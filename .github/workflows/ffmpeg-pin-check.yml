name: ffmpeg pin check

# The Dockerfiles download ffmpeg from a mirror release on this repo
# (ffmpeg-linux-<date>, made by scripts/mirror_ffmpeg_linux.sh). CI never
# builds the image, so a pin that does not resolve would only show up as a
# red Railway deploy and GHCR publish after merge (#962, and again when BtbN
# pruned autobuild-2026-09-10-15-31 after 17 days). This job checks that:
#
#   - both Dockerfiles pin the same release and the same files;
#   - every pinned asset URL resolves.
#
# It runs on any PR that touches a Dockerfile, so a bad pin cannot merge,
# and weekly as a sentinel in case a mirror release is deleted by hand.
# There is no age limit any more: our releases are not pruned.
#
# WARNING: GitHub auto-disables scheduled workflows after 60 days with no
# repo activity. Re-enable from the Actions tab when resuming a dormant project.

on:
  pull_request:
    paths:
      - Dockerfile
      - Dockerfile.gpu
      - .github/workflows/ffmpeg-pin-check.yml
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve every pinned ffmpeg asset
        run: |
          set -euo pipefail
          status=0
          pin() { printf '%s ' "$(sed -n 's/^ARG FFMPEG_RELEASE=\(.*\)$/\1/p' "$1")"; sed -n 's/.*ff_\(file\|sha\)=\([^;]*\);.*/\2/p' "$1" | tr '\n' ' '; }
          if [ "$(pin Dockerfile)" != "$(pin Dockerfile.gpu)" ]; then
            echo "::error file=Dockerfile.gpu::ffmpeg pin differs from Dockerfile ($(pin Dockerfile) vs $(pin Dockerfile.gpu)); keep them in step"
            status=1
          fi
          for df in Dockerfile Dockerfile.gpu; do
            tag=$(sed -n 's/^ARG FFMPEG_RELEASE=\(.*\)$/\1/p' "$df")
            files=$(sed -n 's/.*ff_file=\([^;]*\);.*/\1/p' "$df")
            if [ -z "$tag" ] || [ -z "$files" ]; then
              echo "::error file=$df::no ARG FFMPEG_RELEASE line or no ff_file= assignments found"
              status=1
              continue
            fi
            for f in $files; do
              url="https://github.com/${{ github.repository }}/releases/download/$tag/$f"
              code=$(curl -sIL -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors "$url")
              if [ "$code" = 200 ]; then
                echo "ok   $df $tag/$f"
              else
                echo "::error file=$df::HTTP $code for $url -- mirror it with scripts/mirror_ffmpeg_linux.sh"
                status=1
              fi
            done
          done
          exit $status
