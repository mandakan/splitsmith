name: Publish image (GHCR)

# Publishes the splitsmith container image to GitHub Container Registry so
# self-hosted worker operators can `docker pull` instead of building locally
# (see docs/self-hosted-workers.md). The same image runs serve, worker, and
# the self-hosted agent (ENTRYPOINT is the CLI).
#
# Tags:
#   - push to main            -> :edge          (tracks what staging runs)
#   - release (workflow_call) -> :X.Y.Z, :X.Y, :latest
#   - push tag v* / manual    -> safety-net fallbacks for the above
#
# The release path is a `workflow_call` from release-please.yml gated on
# release_created, NOT the tag-push event: a tag created by release-please via
# GITHUB_TOKEN does not trigger tag workflows, so chaining the publish into the
# release run is the only way it fires automatically (same reason publish-pypi
# is chained there). The caller passes release_tag (e.g. v0.8.0); the tag-push
# trigger stays as a manual/recovery net and derives the version from the ref.
#
# Multi-arch (amd64 + arm64): the arm64 leg builds under QEMU emulation and is
# slow (model bake + dependency sync), which is the accepted cost of a manifest
# that runs natively on both x86 servers and ARM boxes.
#
# The `publish-gpu` job additionally builds Dockerfile.gpu and publishes it under
# `-gpu`-suffixed tags (`:edge-gpu`, `:X.Y.Z-gpu`, `:latest-gpu`) for self-hosted
# agents on an NVIDIA host (issue #796). It is amd64-only -- the CUDA base image
# and onnxruntime-gpu wheels are x86, and a GPU box is x86 in practice -- so it
# skips QEMU and is the faster of the two jobs despite baking the same models.
#
# NOTE (one-time): after the first publish, mark the GHCR package public in the
# repository/package settings, otherwise `docker pull` requires authentication.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: "Release tag to publish as :X.Y.Z/:latest (e.g. v0.8.0); empty builds :edge"
        type: string
        required: false
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  # Serialise per ref; do not cancel an in-flight release build.
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # Skip the :edge build on release-merge commits. The release-please chain
    # (workflow_call, release_tag set) already publishes :X.Y.Z/:latest for
    # these, and both runs land in the same concurrency group -- the plain
    # push :edge build always loses the tie and shows up as a spurious
    # "cancelled" every release. Run when: this is the chained release call
    # (release_tag set), OR a push whose head commit is not a release commit.
    if: >-
      inputs.release_tag != ''
      || !startsWith(github.event.head_commit.message, 'chore(main): release ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # Two semver sources so both entry paths work: the bare `type=semver`
          # lines read a `refs/tags/v*` push ref (recovery/manual net), and the
          # `value=` lines take the tag from the workflow_call input (the release
          # path, which runs on the main ref and so has no tag in the git ref).
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' && inputs.release_tag == '' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{version}},value=${{ inputs.release_tag }},enable=${{ inputs.release_tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.release_tag }},enable=${{ inputs.release_tag != '' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-gpu:
    # Same gating as `publish` (skip the :edge build on release-merge commits;
    # the release chain publishes the tagged variants).
    if: >-
      inputs.release_tag != ''
      || !startsWith(github.event.head_commit.message, 'chore(main): release ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No QEMU: this image is amd64-only (CUDA base + onnxruntime-gpu are x86).
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `suffix=-gpu,onlatest=true` turns every tag the CPU image would get
          # into its `-gpu` sibling: edge->edge-gpu, X.Y.Z->X.Y.Z-gpu, and
          # latest->latest-gpu.
          flavor: |
            suffix=-gpu,onlatest=true
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' && inputs.release_tag == '' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{version}},value=${{ inputs.release_tag }},enable=${{ inputs.release_tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.release_tag }},enable=${{ inputs.release_tag != '' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gpu
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Separate cache scope so the GPU and CPU image layers don't evict
          # each other in the shared gha cache.
          cache-from: type=gha,scope=gpu
          cache-to: type=gha,mode=max,scope=gpu
