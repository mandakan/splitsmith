name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Default ``branches: [main]`` skips PRs whose base is a feature
    # branch (stacked PRs). Match every base so each stacked PR also
    # runs CI.
    branches: ["**"]
    # ``labeled`` so adding ``run-slim-smoke`` to an existing PR
    # triggers a fresh run without needing a force-push.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

jobs:
  test:
    name: lint + format + unit + integration tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Install ffmpeg + ffprobe
        # The tests marked ``integration`` are the only ones that render
        # a file and measure it. Without ffmpeg they skipped, and a
        # skipped test reports as success -- which is how six defects in
        # the compare-grid MP4 renderer reached a green suite (#670).
        # Every one of them was found by running ffmpeg, none by reading
        # code or asserting on command strings.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Sync dependencies
        # --all-groups so the dev group (torch / transformers /
        # panns-inference + the ONNX export tools + lint + tests) is
        # installed alongside the slim runtime deps. The shipped wheel
        # is still slim; CI has to exercise both backends.
        run: uv sync --frozen --all-groups

      - name: Install Chromium for the overlay rasterizer
        # splitsmith.overlay_raster.ChromiumRasterizer (issue #683
        # amendment) is Playwright-backed, and Playwright's own browser
        # is a separate download that is never vendored by the
        # ``playwright`` package or this repo's wheel -- every
        # environment that rasterizes an overlay needs this step once,
        # the same way every environment needs ffmpeg above. Without it,
        # tests/test_overlay_raster.py's integration tests would skip
        # for "no usable Chromium", and SPLITSMITH_REQUIRE_INTEGRATION
        # turns that skip into a failure (see the ffmpeg step's own
        # comment and #670 for why that gate exists).
        #
        # ``--only-shell`` fetches the headless-shell build
        # ``overlay_raster.CHROMIUM_CHANNEL`` launches (260M vs the full
        # browser's 377M; verified byte-identical screenshot output).
        # ``--with-deps`` additionally apt-get installs the OS libraries
        # Chromium needs to run at all, which a bare runner image is not
        # guaranteed to carry.
        run: uv run playwright install --with-deps chromium --only-shell

      - name: Lint (ruff)
        run: uv run ruff check src tests scripts

      - name: Format check (black)
        run: uv run black --check src tests scripts

      - name: Warm numba/librosa JIT cache (avoids the xdist compile race, #742)
        # librosa's numba kernels compile on first use into a shared
        # ``.nbi``/``.nbc`` cache inside site-packages, and those writes are
        # not atomic across processes. Under the ``-n auto`` run below the
        # restored venv carries stale ``.nbi`` that get invalidated and
        # recompiled, so several xdist workers race to rewrite the same file
        # and one segfaults ("worker 'gwN' crashed"). Compiling once here, in
        # a single process after the venv is restored, populates the cache so
        # workers only *read* it (concurrent reads are safe). See #742 for the
        # full diagnosis; it is GitHub-runner-specific and does not repro
        # locally, so CI staying green across several runs is the only gate.
        run: uv run python scripts/warm_numba_cache.py

      - name: Run unit + integration tests
        env:
          # Asserts this environment really can run the integration
          # suite: any test carrying the ``integration`` marker that
          # skips anyway fails the run, and so does an empty selection.
          # Installing ffmpeg is only half the fix -- without this gate
          # nothing notices when the suite silently stops running again,
          # because a skip and a pass are the same colour (#670).
          SPLITSMITH_REQUIRE_INTEGRATION: "1"
        # ``integration`` is not deselected by ``addopts``, so the one
        # invocation covers both suites. The source video the integration
        # tests used to need is gitignored 4K footage; they now build
        # their own clip with ffmpeg (see ``tests/synthetic_media.py``).
        #
        # Parallelism is inherited, not spelled here: ``addopts`` in
        # pyproject.toml carries ``-n auto --dist load``, so this runs
        # across the runner's cores and a developer's bare ``pytest``
        # gets exactly what CI gets. Deliberately not duplicated on this
        # line -- two places to change is how the two drift apart.
        #
        # The integration half parallelises too, and was measured
        # rather than assumed: those tests shell out to real ffmpeg and
        # write real media, so contention was the plausible failure.
        # It is not: 57s serial -> 34s at -n4, 0 skipped at every worker
        # count, no collisions (every test writes under ``tmp_path``).
        run: uv run pytest -q

  migrations:
    # Nothing in CI applied a migration, so the first process that ever
    # ran `alembic upgrade head` on a new revision was the production
    # deploy (#876). A model/migration divergence, a migration that is
    # fine on SQLite and not on Postgres, or two revisions claiming the
    # same parent all shipped with entirely green CI.
    #
    # The default suite cannot close this: it is SQLite-backed and builds
    # its tables with Base.metadata.create_all, so it tests the models,
    # not the chain. The only coverage that genuinely ran the chain
    # against Postgres was the docker suite, which addopts deselects and
    # CI never opted into.
    #
    # Always-on because it is cheap by construction: no models, no
    # ffmpeg, no Node, no dev group -- one Postgres service and the
    # hosted extra. Seconds, not the docker suite's four minutes, and it
    # reports a schema failure rather than a stack failure.
    name: migrations apply + match the models
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: splitsmith
          POSTGRES_PASSWORD: splitsmith
          POSTGRES_DB: splitsmith_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U splitsmith"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Sync hosted deps only
        # Deliberately NOT --all-groups: this job needs sqlalchemy,
        # alembic, asyncpg and procrastinate, and has no business
        # installing torch. It does not need pytest either -- the check
        # is a standalone script.
        run: uv sync --frozen --extra hosted --no-dev

      - name: Migrations apply, match the models, and reverse
        env:
          # alembic/env.py honours this over the ini's baked-in URL, so
          # no CI-specific alembic ini is needed.
          SPLITSMITH_DATABASE_URL: postgresql+asyncpg://splitsmith:splitsmith@localhost:5432/splitsmith_ci
        # --no-dev appears again here, not just on the sync step above:
        # a bare `uv run` performs its own implicit sync against the
        # project's *default* groups, which silently reinstalls the dev
        # group (torch, transformers, the nvidia-* CUDA wheels) and
        # undoes the exclusion the sync step just paid for. Deleting
        # this flag as "redundant" restores the 200MB download the
        # comment above the job claims doesn't happen.
        run: uv run --no-dev python scripts/ci/assert_migrations_match_models.py

  spa:
    # The SPA had no CI validation on a normal PR at all: the job above
    # runs ruff, black and pytest and nothing else, so TypeScript could
    # merge having been compiled nowhere but a developer's laptop. It was
    # built only inside ``slim-smoke`` (opt-in) and at publish time, so
    # the feedback arrived at release time and blocked a release rather
    # than a merge (#647).
    #
    # Always-on because it is cheap by construction: no Python, no
    # models, no R2 egress.
    name: spa typecheck + lint + tests + build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        # No ``version:`` -- the root package.json declares
        # ``packageManager``, and pnpm/action-setup@v4 refuses to run if
        # both are set.
        uses: pnpm/action-setup@v4

      - name: Install SPA dependencies
        working-directory: src/splitsmith/ui_static
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: src/splitsmith/ui_static
        run: pnpm typecheck

      - name: Lint
        working-directory: src/splitsmith/ui_static
        run: pnpm lint

      - name: Unit tests
        working-directory: src/splitsmith/ui_static
        run: pnpm test

      - name: Build
        # Last because it is the slowest and least specific: when the
        # bundle fails to build, one of the three above usually says why.
        working-directory: src/splitsmith/ui_static
        run: pnpm build

  packaging:
    # The cheap half of ``slim-smoke``, promoted to always-on.
    #
    # Every release bug this repo has shipped was a packaging or resolve
    # problem that CI was structurally unable to see, and in each case
    # the assertion that would have caught it was fast: wheel contents
    # (#642), the slim import surface (#388), the ensemble artifacts
    # loading under a freshly-resolved sklearn (#648). What made
    # ``slim-smoke`` expensive -- ``fetch-models`` and a real detection
    # run -- is not what caught them.
    #
    # So the fast assertions run on every PR and the expensive flow stays
    # gated. Deliberately does NOT ``uv sync --all-groups``: ``uv build``
    # is isolated, which keeps torch out of this job entirely.
    name: wheel + artifact sentinels
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Build SPA so the wheel has something to ship
        working-directory: src/splitsmith/ui_static
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          find dist -name '*.map' -delete

      - name: Build wheel
        run: uv build

      - name: Sentinel -- the wheel must contain the built SPA
        run: python3 scripts/ci/assert_wheel_contents.py

      - name: Create fresh slim venv (no dev extras)
        run: uv venv slim-venv --python 3.11

      - name: Install only the built wheel
        # The venv's own interpreter, so this is the install path an end
        # user gets from ``uv tool install splitsmith``.
        run: uv pip install --python slim-venv/bin/python dist/splitsmith-*.whl

      - name: Sentinel -- torch / transformers / panns_inference must NOT be installed
        run: slim-venv/bin/python scripts/ci/assert_slim_import_surface.py

      - name: Sentinel -- ensemble joblib artifacts must load under the resolved sklearn
        # Needs neither fetch-models nor ffmpeg: ``artifacts_dir``
        # resolves to the packaged ``splitsmith/data/``, so these come
        # out of the wheel itself.
        run: slim-venv/bin/python scripts/ci/assert_ensemble_artifacts.py

      - name: CLI -- splitsmith --help
        run: slim-venv/bin/splitsmith --help > /dev/null

  changes:
    # Decides whether a PR touches the inputs ``slim-smoke`` exists to
    # protect. The job was opt-in via a label, which meant it was off by
    # default in exactly the situation it is for -- a change to packaging
    # or to dependency bounds -- and both release bugs it now guards
    # reached a release because nothing ran a fresh resolve against the
    # changed inputs. Remembering a label is not a control.
    name: detect packaging-relevant changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      packaging: ${{ steps.check.outputs.packaging }}

    steps:
      - uses: actions/checkout@v5
        with:
          # Need the base commit to diff against.
          fetch-depth: 0

      - id: check
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE"...HEAD)
          echo "changed files:"
          echo "$changed"
          if echo "$changed" | grep -Eq '^(pyproject\.toml|uv\.lock|\.gitignore|src/splitsmith/data/)'; then
            echo "packaging=true" >> "$GITHUB_OUTPUT"
            echo "-> packaging-relevant; slim-smoke will run"
          else
            echo "packaging=false" >> "$GITHUB_OUTPUT"
            echo "-> not packaging-relevant; slim-smoke stays opt-in"
          fi

  slim-smoke:
    # Release gate: builds the slim wheel + installs it into a fresh venv
    # that has no dev extras, then exercises the user-facing flow end-to-
    # end. Catches "transitive dep went missing" regressions (the kind
    # that bit us on Pillow in PR #388) before they ship.
    #
    # Cadence:
    #   - push to main: automatic (post-merge regression detection)
    #   - workflow_dispatch: manual on-demand from the Actions tab
    #   - pull_request: automatic when the diff touches pyproject.toml,
    #     uv.lock, .gitignore or src/splitsmith/data/**; otherwise
    #     opt-in via the ``run-slim-smoke`` label
    #
    # Still skipped on unrelated PR pushes because each run costs ~2 min
    # wall + ~440 MiB R2 egress; the cheap assertions moved to the
    # ``packaging`` job above, and the same flow runs locally via
    # ``scripts/smoke_slim_install.sh``.
    name: slim wheel smoke test
    runs-on: ubuntu-latest
    needs: [test, changes]
    # ``needs.changes`` is skipped outside pull_request, and a skipped
    # dependency would skip this job too -- hence ``always()`` plus an
    # explicit success check on ``test``.
    if: >-
      always()
      && needs.test.result == 'success'
      && (github.event_name == 'push'
          || github.event_name == 'workflow_dispatch'
          || (github.event_name == 'pull_request'
              && (contains(github.event.pull_request.labels.*.name, 'run-slim-smoke')
                  || needs.changes.outputs.packaging == 'true')))

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Install ffmpeg + ffprobe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Install Node + pnpm (for SPA build)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        # No ``version:`` -- root package.json declares
        # ``packageManager: pnpm@10.30.3`` for the marketing site, and
        # pnpm/action-setup@v4 refuses to run if both are set. Letting
        # it read the version from packageManager keeps the smoke job
        # aligned with the rest of the repo's pnpm.
        uses: pnpm/action-setup@v4

      - name: Build SPA so wheel includes it
        working-directory: src/splitsmith/ui_static
        # The wheel's hatch config ships ui_static/dist; building here
        # populates that path before uv build runs. The maps are dropped
        # because pyproject's ``artifacts`` directive overrides ``exclude``
        # (see #642) -- this mirrors the publish workflow so the smoke test
        # exercises the artifact users actually get.
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          find dist -name '*.map' -delete

      - name: Sync dev deps so we can build the wheel
        run: uv sync --frozen --all-groups

      - name: Build wheel
        run: uv build

      - name: Sentinel -- the wheel must contain the built SPA
        # Shared with the always-on ``packaging`` job so the two cannot
        # drift; a sentinel that has drifted is worse than none.
        run: python3 scripts/ci/assert_wheel_contents.py

      - name: Create fresh slim venv (no dev extras)
        run: uv venv slim-venv --python 3.11

      - name: Install only the built wheel
        # Use the venv's bin/python so this is the same install path
        # an end user would get from ``uv tool install splitsmith``.
        run: uv pip install --python slim-venv/bin/python dist/splitsmith-*.whl

      - name: Sentinel -- torch / transformers / panns_inference must NOT be installed
        run: slim-venv/bin/python scripts/ci/assert_slim_import_surface.py

      - name: CLI -- splitsmith --help
        run: slim-venv/bin/splitsmith --help > /dev/null

      - name: fetch-models --list
        env:
          # Pin the cache under the workspace so it's scoped to this job
          # rather than the runner's $HOME (also lets a future cache step
          # key on it without permissions surprises).
          SPLITSMITH_CONFIG_DIR: ${{ github.workspace }}/slim-cfg
        run: slim-venv/bin/splitsmith fetch-models --list

      - name: fetch-models (real download from R2)
        env:
          SPLITSMITH_CONFIG_DIR: ${{ github.workspace }}/slim-cfg
        # ~440 MiB from models.splitsmith.app; SHA256-verified by the
        # registry. Failure here means R2 + calibration are out of sync.
        run: slim-venv/bin/splitsmith fetch-models

      - name: Sentinel -- ensemble joblib artifacts must load under the resolved sklearn
        env:
          SPLITSMITH_CONFIG_DIR: ${{ github.workspace }}/slim-cfg
        run: slim-venv/bin/python scripts/ci/assert_ensemble_artifacts.py

      - name: splitsmith detect on bundled fixture
        env:
          SPLITSMITH_CONFIG_DIR: ${{ github.workspace }}/slim-cfg
        # Real CLAP + PANN inference through the ONNX runtime path on
        # tests/fixtures/stage-shots-tallmilan-2026-stage3-s97dcec94.wav
        # (Tallmilan 2026 stage 3, audited ground truth 14 shots;
        # detection emits more candidates because echoes / cross-bay
        # aren't filtered until audit). ``stage_sample.wav`` is
        # gitignored -- this canonical tracked fixture is its source.
        run: |
          set -o pipefail
          slim-venv/bin/splitsmith detect \
              --video tests/fixtures/stage-shots-tallmilan-2026-stage3-s97dcec94.wav \
              --time 14.74 \
              | tee detect-output.txt
          # Sanity: the Rich table renders a "N shots" title above the
          # candidates table. Pull N out and assert a plausible range
          # (~40 on the current calibration; allow 20-80 to absorb
          # future model swaps without churning the gate).
          count=$(grep -oE '[0-9]+ shots' detect-output.txt | head -1 | grep -oE '[0-9]+')
          if [ -z "$count" ]; then
              echo "::error::slim-runtime detect produced no parseable shot count"
              exit 1
          fi
          echo "candidate count: $count"
          if [ "$count" -lt 20 ] || [ "$count" -gt 80 ]; then
              echo "::error::slim-runtime detect produced $count candidates; expected 20-80"
              exit 1
          fi
