name: Publish to PyPI

on:
  # Tag-triggered: ``git tag v0.2.0 && git push origin v0.2.0`` from a human
  # fires this directly.
  push:
    tags: ['v*']
  # Callable from release-please.yml so the automatic release flow uses the
  # same publish steps. The OIDC ``job_workflow_ref`` claim points at THIS
  # workflow when called, so one PyPI trusted publisher
  # (workflow filename ``publish-pypi.yml``) covers both code paths.
  workflow_call:
  # Manual on-demand from the Actions tab; honour ``tag`` input so re-publish
  # after a transient PyPI / OIDC outage doesn't need a new tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.2.0). Defaults to the triggering ref.'
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: build wheel + uv publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/splitsmith
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Install Node + pnpm (for SPA build)
        uses: actions/setup-node@v4
        with:
          # Must match ci.yml and .nvmrc. This job builds the SPA that
          # actually ships inside the wheel, so a version only used here
          # is a toolchain no PR ever exercises -- PR CI would stay green
          # while the published artifact was built by something else.
          node-version: "22"

      - name: Install pnpm
        # Version comes from the root package.json packageManager field.
        uses: pnpm/action-setup@v4

      - name: Build SPA so wheel includes it
        working-directory: src/splitsmith/ui_static
        # ``artifacts`` in pyproject.toml re-includes dist/ (it is git-ignored
        # build output), but ``artifacts`` overrides ``exclude`` -- so the
        # ``*.map`` exclude no longer applies and the 4 MB source map would
        # ship. Drop the maps here rather than setting ``sourcemap: false``,
        # so the hosted Docker build keeps them for debugging prod errors.
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          find dist -name '*.map' -delete

      - name: Sync build deps
        run: uv sync --frozen --all-groups

      - name: Build sdist + wheel
        run: uv build

      - name: Verify the wheel actually contains the SPA
        # Guards #642: the root .gitignore's unanchored ``dist/`` made
        # hatchling drop the built SPA, so every published wheel 404'd on
        # ``GET /``. Without this assertion the next .gitignore edit can
        # silently reintroduce it.
        run: |
          python - <<'PY'
          import glob, sys, zipfile

          wheel = glob.glob("dist/splitsmith-*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          if not any(n.endswith("splitsmith/ui_static/dist/index.html") for n in names):
              sys.exit(f"{wheel} ships no SPA: ui_static/dist/index.html missing (see #642)")
          maps = [n for n in names if n.endswith(".map")]
          if maps:
              sys.exit(f"{wheel} ships source maps: {maps}")
          print(f"{wheel}: SPA present, no source maps")
          PY

      - name: Publish to PyPI
        # OIDC trusted publishing -- pypi.org verifies the workflow identity
        # against the configured publisher (mandakan/splitsmith, environment
        # ``pypi``). No API token in repo secrets.
        run: uv publish --trusted-publishing automatic
