<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="splitsmith-positions" content="top-left,top-right,bottom-left,bottom-right">
<title>hud pips</title>
<script>
  // The shipped Pips HUD (spec 2026-10-08): one pip per round filling as
  // the shots land, each with a ring burst, the clock under the row, and
  // the split shown large and draining away. A stage over PIP_LIMIT rounds
  // counts in numerals instead. seek(t) draws any instant from the stage
  // data alone; nothing reads the wall clock. The engine stylesheet is
  // loaded for its font faces only.
  document.write('<style>' + window.splitsmith.engine.css + '</style>');
  document.write('<script src="' + window.splitsmith.assets.shared + '/hud.js"><\/script>');
</script>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  .shade { text-shadow: 0 0 0.45vh rgba(0, 0, 0, 0.7), 0 0.35vh 1.4vh rgba(0, 0, 0, 0.55); }
  .num {
    font-family: "Splitsmith Mono", monospace; font-weight: 700;
    font-variant-numeric: tabular-nums; line-height: 1; white-space: nowrap;
  }
  .label {
    font-family: "Splitsmith Display", sans-serif; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.14em; font-size: 2vh; white-space: nowrap;
  }
  #hud { position: absolute; display: flex; flex-direction: column; gap: 1vh; }
  #hud.top-left { left: 5vh; top: 5vh; align-items: flex-start; }
  #hud.top-right { right: 5vh; top: 5vh; align-items: flex-end; }
  #hud.bottom-left { left: 5vh; bottom: 5vh; align-items: flex-start; flex-direction: column-reverse; }
  #hud.bottom-right { right: 5vh; bottom: 5vh; align-items: flex-end; flex-direction: column-reverse; }
  #pips { display: flex; flex-wrap: wrap; gap: 1vh; max-width: 78vh; }
  #hud.top-right #pips, #hud.bottom-right #pips { justify-content: flex-end; }
  .pip {
    position: relative; width: 2.6vh; height: 2.6vh; border-radius: 50%;
    border: 0.4vh solid; box-sizing: border-box; box-shadow: 0 0 0.9vh rgba(0, 0, 0, 0.6);
  }
  .ring { position: absolute; inset: -0.4vh; border-radius: 50%; border: 0.45vh solid; opacity: 0; }
  #count { font-size: 6vh; }
  #clock { font-size: 9.2vh; }
  #split { position: absolute; left: 0; right: 0; bottom: 7vh; text-align: center; }
  #split .num { font-size: 12.4vh; }
  #split .label { margin-bottom: 0.6vh; }
  #clockRow { display: flex; align-items: flex-end; gap: 2.4vh; }
  #hud.top-right #clockRow, #hud.bottom-right #clockRow { flex-direction: row-reverse; }
  #reloadChip { opacity: 0; border-left: 0.5vh solid; padding-left: 1.2vh; margin-bottom: 0.9vh; }
  #reloadChip .label { margin-bottom: 0.5vh; }
  #reloadChip .num { font-size: 5vh; }
  #hud.top-right #reloadChip, #hud.bottom-right #reloadChip {
    border-left: none; border-right: 0.5vh solid; padding: 0 1.2vh 0 0; text-align: right;
  }
  #stageBar {
    position: relative; height: 0.8vh; border-radius: 0.4vh; box-shadow: 0 0 0.9vh rgba(0, 0, 0, 0.6);
    font-family: "Splitsmith Mono", monospace; font-weight: 700; font-size: 9.2vh;
  }
  #stageFill, .band { position: absolute; top: 0; bottom: 0; border-radius: 0.4vh; }
  #stamp { position: absolute; left: 0; right: 0; top: 34%; text-align: center; opacity: 0; }
  #stamp .label { font-size: 2.5vh; letter-spacing: 0.3em; }
  #stamp .num { font-size: 16vh; }
  /* Upright video: the platform safe area (--safe-bottom, --safe-right
     from --safe-right-top down) stays clear; body.safe is set from
     data.safe_area, so a landscape page never matches these rules. */
  body.safe #hud.bottom-left, body.safe #hud.bottom-right { bottom: calc(var(--safe-bottom) + 5vh); }
  /* A ring bursts about 3vh past its pip: the right corner sits that much
     further in, and the pips wrap short of the column. */
  body.safe #hud.bottom-right { right: calc(var(--safe-right) + 4vh); }
  body.safe #hud.bottom-left #pips, body.safe #hud.bottom-right #pips {
    max-width: calc(100vw - 9vh - var(--safe-right));
  }
  /* Smaller pips on the narrow page, so a twelve-round stage stays one row. */
  body.safe #pips { gap: 0.8vh; }
  body.safe .pip { width: 2.2vh; height: 2.2vh; border-width: 0.35vh; }
  body.safe #split { bottom: calc(var(--safe-bottom) + 7vh); }
  /* A HUD in a bottom corner holds the foot of the frame, so the split
     flashes above where the button column starts. */
  body.safe #hud.bottom-left ~ #split, body.safe #hud.bottom-right ~ #split {
    bottom: calc(100% - var(--safe-right-top) + 2vh);
  }
  body.safe #stamp { right: var(--safe-right); }
</style>
</head>
<body>
<div id="hud">
  <div id="pips"></div>
  <div class="num shade" id="count"></div>
  <div class="num shade" id="clock">0.00</div>
</div>
<div id="split"><div class="label shade" id="splitLabel"></div><div class="num shade" id="splitValue"></div></div>
<div id="stamp"><div class="label shade">Stage time</div><div class="num shade" id="stampValue"></div></div>
<script>
(function () {
  var s = window.splitsmith;
  // Upright video (data.safe_area): the body.safe rules keep every element
  // out of what Shorts, Reels and TikTok draw over.
  if (s.data.safe_area) document.body.classList.add('safe');
  var theme = s.theme, stage = s.data.stage, opts = s.data.options;
  var shots = stage.shots, beep = stage.beep, rounds = stage.rounds;
  // The helpers every shipped HUD shares (_shared/hud.js).
  var kit = window.splitsmithHud(s);
  var clamp = kit.clamp, easeOut = kit.easeOut, backOut = kit.backOut, stageBar = kit.stageBar,
    reloadChip = kit.reloadChip, chipSettle = kit.chipSettle, tierColour = kit.tierColour;
  var PIP_LIMIT = 32, RING = 0.35, SPLIT_FADE = 1.4, FLASH = 0.9, STAMP_DELAY = 0.25, STAMP_IN = 0.35;
  var usePips = rounds > 0 && rounds <= PIP_LIMIT;

  function el(id) { return document.getElementById(id); }

  document.body.style.color = theme.ink;
  el('hud').className = opts.position || 'top-left';
  el('stampValue').textContent = stage.stage_time.toFixed(2);
  el('splitLabel').style.color = theme.ink_2;
  if (!opts.class_labels) el('splitLabel').style.display = 'none';
  var pips = [];
  if (usePips) {
    for (var i = 0; i < rounds; i++) {
      var pip = document.createElement('div');
      pip.className = 'pip';
      pip.style.borderColor = theme.ink;
      var ring = document.createElement('div');
      ring.className = 'ring';
      ring.style.borderColor = theme.accent;
      pip.appendChild(ring);
      el('pips').appendChild(pip);
      pips.push(pip);
    }
    el('count').style.display = 'none';
  } else {
    el('pips').style.display = 'none';
  }
  // The reload chip sits beside the clock, on its baseline and away from
  // the corner; the stage bar runs under the clock, as wide as the clock
  // reads at the stage time. Bottom corners stack the column upwards.
  var bottom = /^bottom/.test(el('hud').className);
  var reload = reloadChip(function () {
    var row = document.createElement('div');
    row.id = 'clockRow';
    el('hud').insertBefore(row, el('clock'));
    row.appendChild(el('clock'));
    var chip = document.createElement('div');
    chip.innerHTML = '<div class="label shade">Reload</div><div class="num shade"></div>';
    chip.style.borderLeftColor = theme.reload;
    chip.style.borderRightColor = theme.reload;
    chip.firstChild.style.color = theme.reload;
    row.appendChild(chip);
    return chip;
  });
  var bar = stageBar();
  if (bar) {
    var clockBox = reload ? el('clockRow') : el('clock');
    el('hud').insertBefore(bar.el, bottom ? clockBox : clockBox.nextSibling);
    // In the clock's own digits (ch), so it is as wide as the clock at the end.
    bar.el.style.width = stage.stage_time.toFixed(2).length + 'ch';
  }

  window.settle = function () {
    return chipSettle(opts.landing ? FLASH : Math.max(SPLIT_FADE, RING));
  };

  window.seek = function (t) {
    var n = 0;
    while (n < shots.length && shots[n].t <= t) n++;
    var last = n ? shots[n - 1] : null;
    var landed = n === shots.length && n > 0 ? t - last.t : -1;
    var landing = opts.landing && landed >= 0;
    var since = last ? t - last.t : Infinity;

    var running = landed >= 0 ? stage.stage_time : Math.max(0, t - beep);
    el('clock').textContent = running.toFixed(2);
    if (bar) bar.seek(running);
    if (reload) reload.seek(t);
    el('count').textContent = n + '/' + rounds;

    var flash = landing && landed < FLASH ? 0.5 + 0.5 * Math.cos(landed / FLASH * Math.PI * 4) : 1;
    for (var i = 0; i < pips.length; i++) {
      var on = i < n;
      pips[i].style.background = on ? theme.accent : 'transparent';
      pips[i].style.borderColor = on ? theme.accent : theme.ink;
      pips[i].style.opacity = landing && landed < FLASH ? 0.4 + 0.6 * flash : 1;
      var age = on ? t - shots[i].t : -1;
      var k = age >= 0 && age < RING ? age / RING : -1;
      var ring = pips[i].firstChild;
      ring.style.opacity = k < 0 ? 0 : 1 - k;
      ring.style.transform = 'scale(' + (k < 0 ? 1 : 1 + 1.6 * easeOut(k)) + ')';
    }

    var split = el('split');
    if (!last || landing) {
      split.style.opacity = 0;
    } else {
      split.style.opacity = clamp(SPLIT_FADE - since);
      split.style.transform = 'scale(' + (since < 0.15 ? 1.25 - 0.25 * easeOut(since / 0.15) : 1) + ')';
      el('splitLabel').textContent = last.label || '';
      el('splitValue').textContent = last.split.toFixed(2);
      el('splitValue').style.color = tierColour(last.tier);
    }

    var stamp = el('stamp');
    var sk = landing ? (landed - STAMP_DELAY) / STAMP_IN : 0;
    stamp.style.opacity = clamp(sk);
    // Upright, the stamp grows into place: shrinking from 1.4x it would
    // sweep over the button column on its way in.
    stamp.style.transform = 'scale(' + (s.data.safe_area ? 0.8 + 0.2 * backOut(sk) : 1.4 - 0.4 * backOut(sk)) + ')';
  };
})();
</script>
</body>
</html>
