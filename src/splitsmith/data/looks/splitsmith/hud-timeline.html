<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>hud timeline</title>
<script>
  // The shipped Timeline HUD (spec 2026-10-08): a lower-third band with
  // the clock at the left, the count at the right, and a track that fills
  // with time and drops a tick at every shot; the newest split floats
  // above its tick. It places itself (no positions). seek(t) draws any
  // instant from the stage data alone; nothing reads the wall clock. The
  // engine stylesheet is loaded for its font faces only.
  document.write('<style>' + window.splitsmith.engine.css + '</style>');
  document.write('<script src="' + window.splitsmith.assets.shared + '/hud.js"><\/script>');
</script>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  .shade { text-shadow: 0 0 0.45vh rgba(0, 0, 0, 0.7), 0 0.35vh 1.4vh rgba(0, 0, 0, 0.55); }
  .num {
    font-family: "Splitsmith Mono", monospace; font-weight: 700;
    font-variant-numeric: tabular-nums; line-height: 1; white-space: nowrap;
  }
  .label {
    font-family: "Splitsmith Display", sans-serif; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.14em; white-space: nowrap;
  }
  #band { position: absolute; left: 0; right: 0; bottom: 0; height: 17vh; }
  #clock { position: absolute; left: 5vh; bottom: 3.9vh; font-size: 8.2vh; }
  #count { position: absolute; right: 5vh; bottom: 3.9vh; font-size: 5.7vh; }
  #track { position: absolute; left: 22%; right: 14%; bottom: 6.4vh; height: 0.9vh; border-radius: 0.45vh; }
  #fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0.45vh; }
  .tick { position: absolute; top: -1.6vh; width: 0.55vh; height: 4.1vh; margin-left: -0.27vh; transform-origin: 50% 100%; }
  #tag {
    position: absolute; bottom: 3.9vh; padding: 0.4vh 1.2vh; border-radius: 0.7vh; text-align: center;
  }
  #tag .label { font-size: 1.6vh; }
  #tag .num { font-size: 3.9vh; }
  .band { position: absolute; top: 0; bottom: 0; border-radius: 0.45vh; }
  #chip {
    position: absolute; left: 5vh; bottom: 13.2vh; padding: 0.4vh 1.2vh; border-radius: 0.7vh;
    border: 0.2vh solid; opacity: 0;
  }
  #chip .label { font-size: 1.6vh; }
  #chip .num { font-size: 3.2vh; }
  /* Upright video: the clock is as wide as a fifth of the page, so the
     track lifts off the clock row and runs the page's width, its split
     tag above it, and the chip above the tag. */
  @media (max-aspect-ratio: 1/1) {
    #band { height: 30vh; }
    #track { left: 5vh; right: 5vh; bottom: 14.5vh; }
    #chip { bottom: 26.5vh; }
  }
  #stamp { position: absolute; left: 0; right: 0; top: 34%; text-align: center; opacity: 0; }
  #stamp .label { font-size: 2.5vh; letter-spacing: 0.3em; }
  #stamp .num { font-size: 16vh; }
</style>
</head>
<body>
<div id="band"></div>
<div class="num shade" id="clock">0.00</div>
<div class="num shade" id="count"></div>
<div id="track"><div id="fill"></div></div>
<div id="stamp"><div class="label shade">Stage time</div><div class="num shade" id="stampValue"></div></div>
<script>
(function () {
  var s = window.splitsmith;
  var theme = s.theme, stage = s.data.stage, opts = s.data.options;
  var shots = stage.shots, beep = stage.beep, rounds = stage.rounds;
  // The helpers every shipped HUD shares (_shared/hud.js).
  var kit = window.splitsmithHud(s);
  var span = kit.span, clamp = kit.clamp, easeOut = kit.easeOut, backOut = kit.backOut, rgba = kit.rgba,
    tierColour = kit.tierColour, along = kit.along;
  var DROP = 0.2, TAG_IN = 0.2, STAMP_DELAY = 0.2, STAMP_IN = 0.35;

  function el(id) { return document.getElementById(id); }
  function at(shot) { return along(shot.t) + '%'; }

  document.body.style.color = theme.ink;
  el('band').style.background =
    'linear-gradient(0deg, ' + rgba(theme.surface, 0.88) + ', ' + rgba(theme.surface, 0) + ')';
  el('track').style.background = rgba(theme.ink, 0.22);
  el('fill').style.background = theme.ink;
  el('stampValue').textContent = stage.stage_time.toFixed(2);
  // Bands sit over the fill (they grow with it, so the track never shows a
  // region before it happens) and under the ticks.
  var bands = kit.regionBands(el('track'));
  var reload = kit.reloadChip(function () {
    var chip = document.createElement('div');
    chip.innerHTML = '<div class="label">Reload</div><div class="num"></div>';
    chip.style.background = rgba(theme.surface, 0.9);
    chip.style.borderColor = theme.reload;
    chip.firstChild.style.color = theme.reload;
    document.body.appendChild(chip);
    return chip;
  }, 'chip');
  var ticks = shots.map(function (shot) {
    var tick = document.createElement('div');
    tick.className = 'tick';
    tick.style.left = at(shot);
    tick.style.background = theme.accent;
    el('track').appendChild(tick);
    return tick;
  });
  var tag = document.createElement('div');
  tag.id = 'tag';
  tag.innerHTML = '<div class="label"></div><div class="num"></div>';
  tag.style.background = rgba(theme.surface, 0.9);
  tag.firstChild.style.color = theme.ink_2;
  if (!opts.class_labels) tag.firstChild.style.display = 'none';
  el('track').appendChild(tag);

  window.settle = function () {
    return kit.chipSettle(opts.landing ? Math.max(DROP, STAMP_DELAY + STAMP_IN) : Math.max(DROP, TAG_IN));
  };

  window.seek = function (t) {
    var n = 0;
    while (n < shots.length && shots[n].t <= t) n++;
    var last = n ? shots[n - 1] : null;
    var landed = n === shots.length && n > 0 ? t - last.t : -1;
    var landing = opts.landing && landed >= 0;
    var since = last ? t - last.t : Infinity;
    var running = landed >= 0 ? stage.stage_time : Math.max(0, t - beep);

    el('clock').textContent = running.toFixed(2);
    el('count').textContent = n + '/' + rounds;
    el('fill').style.width = 100 * clamp(running / span) + '%';
    bands.seek(running);
    if (reload) reload.seek(t);
    for (var i = 0; i < ticks.length; i++) {
      var age = t - shots[i].t;
      ticks[i].style.opacity = age < 0 ? 0 : 1;
      ticks[i].style.transform = 'scaleY(' + (age < 0 ? 0 : backOut(age / DROP)) + ')';
    }

    if (!last || landing) {
      tag.style.opacity = 0;
    } else {
      var k = easeOut(since / TAG_IN);
      tag.style.opacity = k;
      tag.style.left = at(last);
      tag.style.transform = 'translate(-50%, ' + 2 * (1 - k) + 'vh)';
      tag.firstChild.textContent = last.label || '';
      tag.lastChild.textContent = last.split.toFixed(2);
      tag.lastChild.style.color = tierColour(last.tier);
      // A tick near either end of a page-wide track (upright) would put
      // the centred tag past the edge: hold its centre half its width and
      // a margin in. A tag that fits keeps its percentage, so a landscape
      // track, which never reaches the edges, draws as it always did.
      var track = el('track').getBoundingClientRect();
      var half = tag.offsetWidth / 2, margin = window.innerHeight * 0.02;
      var centre = track.left + track.width * along(last.t) / 100;
      var tagX = Math.max(half + margin, Math.min(window.innerWidth - half - margin, centre));
      if (tagX !== centre) tag.style.left = (tagX - track.left) + 'px';
    }

    var stamp = el('stamp');
    var sk = landing ? (landed - STAMP_DELAY) / STAMP_IN : 0;
    stamp.style.opacity = clamp(sk);
    stamp.style.transform = 'scale(' + (1.4 - 0.4 * backOut(sk)) + ')';
  };
})();
</script>
</body>
</html>
