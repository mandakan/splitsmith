<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="splitsmith-frames" content="edges">
<title>starter: broadcast sting</title>
<!--
  The transition between two stages, using every piece of data a sting
  gets. A panel in the Look's surface sweeps across with an accent edge,
  pushing the outgoing stage off ahead of it, holds over the cut carrying
  the next stage's name, and sweeps away with the incoming stage pushed in
  behind it. It is a frames sting (the meta tag above, #1535): it draws
  the whole picture, footage included, from data.transition.frames
  through _shared/frames.js, so nothing of it may be left transparent.
  duration() and sounds() never read the frames: the renderer loads the
  template once without them.
  window.splitsmith.data:
    transition { kind ("sting:<name>"), name, duration_seconds,
                 from, to,    the labels either side of the cut
                 frames { fps, count, from[], to[] } }   the edges' pictures
    shooters[] { label, accent, club, logo }
    brand      { logo, line } when the export puts your brand on the wipe
  duration() must return transition.duration_seconds: the renderer
  samples exactly that long.
  Guide: docs/looks/authoring.md#frames-stings
-->
<script>
  document.write('<style>' + window.splitsmith.engine.css + '</style>');
  document.write('<script src="' + window.splitsmith.assets.shared + '/frames.js"><\/script>');
</script>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; width: 100vw; height: 100vh; }
  #footage { position: absolute; top: 0; left: 0; z-index: 0; display: block; }
  #panel { position: absolute; z-index: 1; top: 0; bottom: 0; left: 0; width: 100vw; display: flex; flex-direction: column;
           justify-content: center; padding: 0 10vh; box-sizing: border-box; gap: 1.4vh; }
  #edge { position: absolute; z-index: 2; top: 0; bottom: 0; width: 1.6vh; }
  .cap { font-family: "Splitsmith Mono", monospace; font-size: 2.4vh; letter-spacing: 0.14em; text-transform: uppercase; }
  #to { align-self: flex-start; font-family: "Splitsmith Display", sans-serif; font-weight: 700; font-size: 11vh; line-height: 1; white-space: nowrap; }
  #mark { position: absolute; right: 8vh; top: 50%; transform: translateY(-50%); height: 18vh; max-width: 30vh; object-fit: scale-down; }
</style>
</head>
<body>
<canvas id="footage"></canvas>
<div id="panel"><div class="cap" id="next">Next</div><div id="to"></div></div>
<div id="edge"></div>
<script>
  var S = window.splitsmith, D = S.data, T = S.theme, TR = D.transition || {};
  var LENGTH = TR.duration_seconds || 1, W = S.size.width, H = S.size.height;
  var $ = function (id) { return document.getElementById(id); };
  var accent = (D.shooters && D.shooters[0] && D.shooters[0].accent) || T.accent;

  $('panel').style.background = T.surface;
  $('panel').style.color = T.ink;
  $('next').style.color = T.ink_2;
  $('edge').style.background = accent;
  $('to').textContent = TR.to || '';
  if (!TR.to) $('next').style.display = 'none';
  // Your brand when the export puts it on the wipe; else a single shooter logo.
  var mark = D.brand && D.brand.logo ? D.brand.logo : null;
  if (!mark) {
    var logos = (D.shooters || []).map(function (s) { return s.logo; }).filter(Boolean);
    if (logos.length === 1) mark = logos[0];
  }
  if (mark) {
    var img = document.createElement('img');
    img.id = 'mark';
    img.src = mark;
    $('panel').appendChild(img);
  }

  var footage = $('footage');
  footage.width = W;
  footage.height = H;
  var g = footage.getContext('2d');

  // In over the first 40 %, hold, out over the last 40 %: the panel covers
  // the frame across the cut.
  function ease(p) { return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; }
  // The panel's offset at t, in vw: -100 (off the left) to 0 (covering) to
  // 100 (off the right).
  function offset(t) {
    var p = t / LENGTH;
    if (p < 0.4) return -100 + 100 * ease(p / 0.4);
    if (p > 0.6) return 100 * ease((p - 0.6) / 0.4);
    return 0;
  }
  function paint(t) {
    var p = t / LENGTH, x = offset(t);
    $('panel').style.transform = 'translateX(' + x + 'vw)';
    // The accent edge leads the panel in and trails it out.
    $('edge').style.left = p < 0.5 ? 'calc(' + (x + 100) + 'vw - 1.6vh)' : x + 'vw';
    $('edge').style.display = x <= -100 || x >= 100 ? 'none' : 'block';
  }
  // Sound, timed to the sweep, so it follows the transition's length: the
  // riser peaks as the panel covers the frame (40 %), a softer swoosh
  // carries it out at its fastest (80 %). A cue's hit may start the file
  // before the transition does; it is mixed from there.
  window.sounds = function () {
    return [
      { play: 'sting.m4a', at: 0.4 * LENGTH, hit: 0.59, gain: 0.8 },
      { play: 'swoosh-soft.m4a', at: 0.8 * LENGTH, hit: 0.26, gain: 0.5 }
    ];
  };
  var now = LENGTH / 2;
  window.duration = function () { return LENGTH; };
  window.poster = function () { return LENGTH / 2; };
  // The footage behind the panel: on the way in the outgoing stage moves
  // right ahead of the panel's leading edge; while it holds the panel
  // covers everything, so no picture is decoded; on the way out the
  // incoming stage follows its trailing edge in. Black wherever neither is.
  function footageAt(t, pair) {
    var p = t / LENGTH, x = offset(t);
    g.fillStyle = '#000';
    g.fillRect(0, 0, W, H);
    if (p < 0.4) window.splitsmithFrames.draw(g, pair.from, Math.round((x + 100) * W / 100), 0, W, H);
    else if (p > 0.6) window.splitsmithFrames.draw(g, pair.to, Math.round((x - 100) * W / 100), 0, W, H);
  }
  window.seek = function (t) {
    now = t;
    paint(t);
    var F = window.splitsmithFrames, p = t / LENGTH;
    if (p >= 0.4 && p <= 0.6) return Promise.resolve(footageAt(t, { from: null, to: null }));
    return F.at(Math.round(t * (F.fps || S.fps))).then(function (pair) { footageAt(t, pair); });
  };
  window.__splitsmithFit = function () {
    var to = $('to'), size = parseFloat(getComputedStyle(to).fontSize);
    // The name's own width (the element hugs its text: align-self above).
    while (to.getBoundingClientRect().width > S.size.width * 0.7 && size > S.engine.min_font_size) {
      size -= 2;
      to.style.fontSize = size + 'px';
    }
    paint(now);
  };
  paint(now);
</script>
</body>
</html>
